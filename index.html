<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Web BLE Motor Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="UTF-8">
</head>
<body>
    <div class="topnav">
        <h1>ESP32 Web BLE Motor Control</h1>
    </div>
    <div class="content">
        <div class="card-grid">
            <div class="card">
                <p>
                    <button id="connectBleButton" class="connectButton">Connect to BLE Device</button>
                    <button id="disconnectBleButton" class="disconnectButton">Disconnect BLE Device</button>
                </p>
                <p class="gray-label">BLE state: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong></p>
            </div>
        </div>

        <div class="card-grid">
            <div class="card">
                <h2>Motor Speed Feedback</h2>
                <p class="reading"><span id="valueContainer">NaN</span></p>
                <p class="gray-label">Last reading: <span id="timestamp"></span></p>
            </div>

            <div class="card">
                <h2>Motor Speed Control</h2>
                <input type="range" id="speedSlider" min="0" max="255" value="0">
                <p>Set Speed: <span id="setSpeedDisplay">0</span></p>
                <p class="gray-label">Last speed sent: <span id="speedSent"></span></p>
            </div>
        </div>
    </div>
</body>

<script>
    // DOM Elements
    const connectButton = document.getElementById('connectBleButton');
    const disconnectButton = document.getElementById('disconnectBleButton');
    const speedSlider = document.getElementById('speedSlider');
    const setSpeedDisplay = document.getElementById('setSpeedDisplay');
    const retrievedValue = document.getElementById('valueContainer');
    const latestValueSent = document.getElementById('speedSent');
    const bleStateContainer = document.getElementById('bleState');
    const timestampContainer = document.getElementById('timestamp');

    // BLE UUIDs
    var deviceName ='ESP32';
    var bleService = '19b10000-e8f2-537e-4f6c-d104768a1214';
    var motorSpeedCharUUID = '19b10002-e8f2-537e-4f6c-d104768a1214'; // Write speed
    var feedbackCharUUID = '19b10001-e8f2-537e-4f6c-d104768a1214';   // Notify encoder speed

    // BLE objects
    var bleServer;
    var bleServiceFound;
    var feedbackCharacteristic;

    connectButton.addEventListener('click', () => {
        if (isWebBluetoothEnabled()) connectToDevice();
    });

    disconnectButton.addEventListener('click', disconnectDevice);

    speedSlider.addEventListener('input', () => {
        const speed = parseInt(speedSlider.value);
        setSpeedDisplay.innerText = speed;
        writeSpeedToCharacteristic(speed);
    });

    function isWebBluetoothEnabled() {
        if (!navigator.bluetooth) {
            console.log('Web Bluetooth API not available!');
            bleStateContainer.innerHTML = "Web Bluetooth API is not available!";
            return false;
        }
        return true;
    }

    function connectToDevice(){
        console.log('Requesting BLE device...');
        navigator.bluetooth.requestDevice({
            filters: [{name: deviceName}],
            optionalServices: [bleService]
        })
        .then(device => {
            bleStateContainer.innerHTML = 'Connected to device ' + device.name;
            bleStateContainer.style.color = "#24af37";
            device.addEventListener('gattservicedisconnected', onDisconnected);
            return device.gatt.connect();
        })
        .then(server => {
            bleServer = server;
            return bleServer.getPrimaryService(bleService);
        })
        .then(service => {
            bleServiceFound = service;
            return service.getCharacteristic(feedbackCharUUID);
        })
        .then(characteristic => {
            feedbackCharacteristic = characteristic;
            characteristic.addEventListener('characteristicvaluechanged', handleCharacteristicChange);
            return characteristic.startNotifications();
        })
        .then(() => {
            console.log("Notification started for encoder speed");
        })
        .catch(error => {
            console.error('BLE connection error:', error);
        });
    }

    function handleCharacteristicChange(event){
        const value = new TextDecoder().decode(event.target.value);
        console.log("Encoder speed:", value);
        retrievedValue.innerText = value;
        timestampContainer.innerText = getDateTime();
    }

    function writeSpeedToCharacteristic(speed){
        if (bleServer && bleServer.connected) {
            bleServiceFound.getCharacteristic(motorSpeedCharUUID)
            .then(characteristic => {
                const data = new Uint8Array([speed]);
                return characteristic.writeValue(data);
            })
            .then(() => {
                latestValueSent.innerText = speed;
                console.log("Speed written:", speed);
            })
            .catch(error => {
                console.error("Failed to write speed:", error);
            });
        } else {
            alert("Not connected to BLE device!");
        }
    }

    function disconnectDevice() {
        if (bleServer && bleServer.connected) {
            if (feedbackCharacteristic) {
                feedbackCharacteristic.stopNotifications()
                    .then(() => {
                        console.log("Notifications stopped");
                        bleServer.disconnect();
                        bleStateContainer.innerHTML = "Device Disconnected";
                        bleStateContainer.style.color = "#d13a30";
                    })
                    .catch(error => {
                        console.error("Error during disconnect:", error);
                    });
            }
        } else {
            alert("No BLE device connected.");
        }
    }

    function onDisconnected(event){
        console.log('Device disconnected:', event.target.device.name);
        bleStateContainer.innerHTML = "Device disconnected";
        bleStateContainer.style.color = "#d13a30";
    }

    function getDateTime() {
        const d = new Date();
        return d.toLocaleDateString() + " " + d.toLocaleTimeString();
    }
</script>
</html>
